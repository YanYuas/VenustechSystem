# ============================================================
# 后端 CI（GitHub Actions）
#
# 为什么需要（证据：.arch-audit/reports/ops-docs.md §7）：
#   .github/workflows 里此前只有 android-build.yml，后端 pytest（1164 条）、
#   架构守护、端到端冒烟全部只靠本地手工执行，从未进过门禁。
#   历史教训（《一期模块考校报告》E-01）：tests/test_architecture.py 写好却
#   从未执行，分层违规悄悄累积到 7 处 ——「写了却跑不了 = 等于没有测试」。
#
# 下面每条命令都已在本机验证可直接执行，且都不依赖 Windows，Linux runner 上一致：
#   backend/tests/test_architecture.py  自带免 pytest 入口（自行把 backend 注入 sys.path）
#   backend/scripts/smoke_backend.py    FastAPI TestClient 端到端，数据落系统临时目录
#   python -m pytest tests -q           backend/pyproject.toml 已配 testpaths/pythonpath，
#                                       工作目录设为 backend 即可
# ============================================================
name: backend-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - "docs/architecture/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "docs/architecture/**"
      - ".github/workflows/backend.yml"

# 最小权限：只读仓库内容（本 workflow 不写回、不发版）
permissions:
  contents: read

# 同一分支/PR 的新提交取消旧运行，省 runner 分钟
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: lint + pytest + 架构守护 + 冒烟
    runs-on: ubuntu-latest
    # 防止某个用例挂死把 6 小时的默认上限烧完
    timeout-minutes: 30
    env:
      # 兜底：任何步骤都不许把运行期数据写进仓库工作区（一律写 runner 临时目录）。
      # 注：tests/conftest.py 与 scripts/smoke_backend.py 内部会各自覆写这个变量
      #     （它们指向系统临时目录），此处只是抛点。
      # ⚠ 不能用 ${{ runner.temp }}：runner 上下文在 job 级 env 不可用，GitHub 会
      #   直接判 workflow 非法（实测 0s 失败、无日志）。runner 是 ubuntu-latest，用 /tmp。
      VENUSTECH_DATA_DIR: /tmp/venustech-data
      VENUSTECH_DEV: "false"
      # 守护脚本会打印中文与 ✅/❌；固定 UTF-8，避免非 UTF-8 locale 下 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 依赖文件未变则复用 pip 缓存
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt 内已含 `-r requirements.txt`；两者都显式写出，
          # 是为了让「运行时依赖 / 测试依赖」的边界在 CI 里一眼可见（与 setup.bat 同源）。
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Show toolchain versions
        run: |
          python -V
          python -m pytest --version
          python -m ruff --version

      # 免 pytest 入口：即使 pytest 装不上也要能把分层守护跑起来（E-01 的直接对策）
      - name: Architecture guard (tests/test_architecture.py)
        run: python backend/tests/test_architecture.py

      # ⚠️ 依赖 Lead 交付脚本 scripts/audit_architecture.py（AST 版架构守护，R1–R10）。
      # 用 --strict：基线内的技术债也算失败 —— 脚本作者标注「CI 收口用」就是这个口径，
      # 否则基线会变成只增不减的免死金牌。
      # 脚本缺失时本步骤显式失败是**预期行为**：门禁不可以「脚本不在就悄悄跳过」，
      # 那正是本项目反复踩过的「写了却没人跑」。若需临时放宽，改成
      #   if [ -f scripts/audit_architecture.py ]; then python …; fi  （并且明确接受空跑）
      - name: Architecture audit (scripts/audit_architecture.py --strict)
        run: |
          if [ ! -f scripts/audit_architecture.py ]; then
            echo "::error::缺少 scripts/audit_architecture.py（Lead 待交付）——架构审计门禁未就绪"
            exit 1
          fi
          python scripts/audit_architecture.py --strict

      # 后端 lint（D-13 + D-16）：规则口径在 backend/pyproject.toml —— 只启 E4/E7/E9/F 正确性规则，
      # 显式忽略 E501（线长），**不跑 ruff format**（全仓格式化会产出千行纯风格 diff）。
      # 覆盖 app + tests + scripts（D-16 起把 backend/scripts/** 也纳入，与 check_all.py 第 15 项一致）。
      # 放在 pytest 之前：lint 秒级失败，比等几分钟测试更早给信号。
      - name: "Ruff lint (correctness rules: E4/E7/E9/F)"
        working-directory: backend
        timeout-minutes: 5
        run: python -m ruff check app tests scripts

      - name: Backend test suite (pytest)
        working-directory: backend
        timeout-minutes: 20
        # -p no:cacheprovider：不写 .pytest_cache（runner 上无意义且会弄脏工作区）
        run: python -m pytest tests -q -p no:cacheprovider --tb=short

      # Phase6 测试质量基建：覆盖率**阈值棘轮**（只升不降）。
      # 当前实测 97.98% statements；阈值 97（留约 1pp 余量防抖动），
      # 后续补测后应同步上调（下调必须在 CHANGELOG 说明理由）。
      # 与本地同一条命令：pytest tests -q --cov=app --cov-report=term-missing --cov-fail-under=97
      # 另出 XML 报告（coverage.xml → artifact backend-coverage，供趋势/排障；不影响退出码）。
      # 不再 continue-on-error：覆盖率回退要能拦住合并。
      - name: "Coverage (threshold ratchet: 97%)"
        if: always()
        working-directory: backend
        timeout-minutes: 20
        run: |
          python -m pytest tests -q -p no:cacheprovider --tb=short \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=97

      # 覆盖率报告进 artifact：if: always() 保证「测试/阈值失败」时也有报告可看；
      # continue-on-error 保证「上传动作自身失败」（网络/artifact 服务抖动）**不会把 job 判红** ——
      # 覆盖率报告是辅助诊断产物，测试/门禁结论只由 pytest 退出码与阈值步骤决定。
      - name: Upload backend coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Backend smoke (end-to-end + migration + regression)
        working-directory: backend
        timeout-minutes: 8
        run: python scripts/smoke_backend.py
