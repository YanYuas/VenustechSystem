# ============================================================
# 后端工具配置（不是依赖清单！）
#
# 依赖的唯一事实来源是 requirements.txt（运行时）与 requirements-dev.txt
# （开发/测试），原因见 docs/architecture/ADR/0005-version-and-dependency-single-source.md。
# 本文件只放工具链配置：pytest / ruff / 静态检查。
#
# version 必须与仓库根 VERSION 文件一致，由 scripts/check_versions.py 校验。
# ============================================================
[project]
name = "qimingxing-backend"
version = "1.0.0"
description = "启明星系统后端（FastAPI + SQLAlchemy + SQLite，本地优先）"
requires-python = ">=3.11"

# 说明：这里刻意不声明 [project.dependencies]。
#   - 依赖由 requirements.txt 管理（setup.bat / CI 都按它安装，已锁定精确版本）；
#   - 若在此重复声明，两份清单必然漂移（当前 pyproject 曾与 requirements 完全脱节）。
#   若将来迁移到 uv/pyproject 管理，须同时删除 requirements.txt 并更新
#   setup.bat、CI、docs/guides/development.md 三处引用，一步到位。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# 不把运行期数据库写进仓库；测试用独立临时目录（见 tests/conftest.py）
norecursedirs = ["data*", "var", ".venv", "migrations"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["migrations/versions"]

# ============================================================
# Ruff 规则口径（D-13）：只把「正确性」规则变成门禁，不做风格重排。
#
# 为什么不用 `ruff format` / 不启用 E5、W 等风格规则：
#   本仓后端已有 1300+ 用例与 172 个模块，全量格式化会产出约 2000 行纯风格
#   diff，把真实改动淹没，且与「业务逻辑零改动」的审计要求冲突。
#   因此 select 只取 pyflakes（F）+ pycodestyle 的「错误类」前缀：
#     E4 导入问题（E401 一行多导入 / E402 导入不在顶部）
#     E7 语法与比较陷阱（E711/E712/E713/E714/E721/E722/E731/E741）
#     E9 运行期错误（E901 语法错误 / E902 读文件失败 / E999 解析失败）
#     F  pyflakes 全套（未定义名 / 未使用导入与变量 / 重定义 / f-string 无占位符）
#   这些规则命中即代表「可能跑不起来」或「代码在骗人」，是值得 CI 拦下的。
#
# 不用 `--fix` 之外的自动格式化；`python -m ruff check` 即 CI 门禁。
#
# D-16 起门禁覆盖 backend 下 app + tests + scripts 三处（CI backend.yml 与
# scripts/check_all.py 第 15 项同一命令：`ruff check app tests scripts`）。
# scripts/ 无需任何 per-file-ignores —— 13 条问题全部按「删未用导入/去死代码/
# 补真实缺导入/去多余 f 前缀」修掉，没有合法的 re-export 或动态 import 豁免。
# ============================================================
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

ignore = [
    # 行长（110）纯风格，不是正确性问题：全仓仍有大量超长行，
    # 启用会制造大面积无意义 diff。改由人工评审 + IDE 提示。
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# 包级 re-export 入口：这些导入是「对外 API」，不是未使用导入。
#   1) app/models/__init__.py —— 逐模块导入是架构守护 R6 的硬要求：
#      没有在这里导入的 model 不会被注册到 Base.metadata，迁移就不会建表；
#   2) app/repositories/__init__.py / app/schemas/__init__.py —— 同上，统一出口。
# 若哪天改成显式 __all__，这里的三条豁免即可删除。
"app/models/__init__.py" = ["F401"]
"app/repositories/__init__.py" = ["F401"]
"app/schemas/__init__.py" = ["F401"]
