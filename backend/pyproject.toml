[project]
name = "qimingxing-backend"
version = "0.1.0"
description = "启明星系统后端（FastAPI 子进程 + SQLite）"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["migrations/versions"]
