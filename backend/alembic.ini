# Qimingxing backend Alembic config
#
# NOTE: keep this file ASCII-only. logging.config.fileConfig() reads the ini
# with the system locale encoding (GBK on zh-CN Windows), so non-ASCII comments
# raise UnicodeDecodeError before any migration runs. Use English here.
#
# sqlalchemy.url below is a PLACEHOLDER. migrations/env.py always overrides it
# with app.config.settings.db_url -- the single source of truth for the
# connection string, which is what makes VENUSTECH_DATA_DIR work for BOTH the
# startup migration path (app/migrate.py) and the manual `alembic` CLI path.
# (Fixed 2026-09-16: the CLI path used to read this literal value, so branch
# migrations silently wrote to the main database.)
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///./data/app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
